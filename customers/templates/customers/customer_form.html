{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h3 class="mb-3"><i class="bi bi-person-vcard"></i> {{ title }}</h3>
<div class="card card-stat p-4" style="max-width:600px;">
<form method="post">
  {% csrf_token %}
  {% for field in form %}
    <div class="mb-3">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
    </div>
  {% endfor %}
  <button type="submit" class="btn btn-primary"><i class="bi bi-check2-circle"></i> Save</button>
  <a href="{% url 'customers:customer_list' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
