{% extends "base.html" %}
{% block title %}Brands{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Brands</h3>
  <a href="{% url 'products:brand_create' %}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add Brand</a>
</div>
<div class="card card-stat p-3">
<table class="table table-hover">
<thead><tr><th>Name</th><th>Products</th><th>Actions</th></tr></thead>
<tbody>
{% for b in brands %}
<tr><td>{{ b.name }}</td><td>{{ b.products.count }}</td>
<td>
  <form method="post" action="{% url 'products:brand_delete' b.pk %}" onsubmit="return confirm('Delete?');">
    {% csrf_token %}
    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
  </form>
</td></tr>
{% empty %}<tr><td colspan="3" class="text-center text-muted">No brands yet.</td></tr>{% endfor %}
</tbody>
</table>
</div>
{% endblock %}
