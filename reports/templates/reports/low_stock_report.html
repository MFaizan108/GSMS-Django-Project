{% extends "base.html" %}
{% block title %}Low Stock Report{% endblock %}
{% block content %}
<h3>Low Stock Report</h3>
<div class="card card-stat p-3">
<table class="table"><thead><tr><th>Product</th><th>Current Stock</th><th>Minimum Stock</th></tr></thead>
<tbody>{% for p in products %}<tr><td>{{ p.name }}</td><td class="text-danger">{{ p.stock }}</td><td>{{ p.minimum_stock }}</td></tr>
{% empty %}<tr><td colspan="3" class="text-center text-muted">No low stock products. Great!</td></tr>{% endfor %}</tbody></table>
</div>
{% endblock %}
