<form method="get" class="row g-2 mb-3 align-items-end">
  <div class="col-auto"><label class="form-label mb-0">From</label><input type="date" name="start" value="{{ start }}" class="form-control"></div>
  <div class="col-auto"><label class="form-label mb-0">To</label><input type="date" name="end" value="{{ end }}" class="form-control"></div>
  <div class="col-auto"><button type="submit" class="btn btn-primary">Filter</button></div>
</form>
