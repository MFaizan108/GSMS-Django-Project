{% extends "base.html" %}
{% block title %}Least Selling Products{% endblock %}
{% block content %}
<h3>Least Selling Products</h3>
<div class="card card-stat p-3">
<table class="table"><thead><tr><th>Product</th><th>Qty Sold</th><th>Revenue</th></tr></thead>
<tbody>{% for i in items %}<tr><td>{{ i.product__name }}</td><td>{{ i.total_qty }}</td><td>{{ i.total_revenue }}</td></tr>
{% empty %}<tr><td colspan="3" class="text-center text-muted">No sales yet.</td></tr>{% endfor %}</tbody></table>
</div>
{% endblock %}
